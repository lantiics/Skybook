test:
  image: oven/bun:1.4
  services:
    - name: postgres:18
      alias: postgres
  before_script:
    - bun install
    - cp config.sample.toml config.toml
  script:
    - until bash -c 'echo > /dev/tcp/postgres/5432' 2>/dev/null; do sleep 1; done
    - bun run src/startup/migrate.ts
    - bun test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - when: manual
      allow_failure: true
