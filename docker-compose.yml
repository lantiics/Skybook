services:
  skybook:
    image: skybook:latest
    restart: unless-stopped
    networks:
      - cap_default
      - skybook_default
    ports:
      - 3000:3000
    volumes:
      - ./skybook/.env:/app/.env
      - ./skybook/config.toml:/app/config.toml
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    env_file: ./.env.postgres 
    networks:
      - skybook_default
    environment:
      POSTGRES_DB: skybook
    ports:
      - 5432:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql
      - ./schema:/docker-entrypoint-initdb.d/

configs:
  skybook_config:
    file: ./config.toml

networks:
  cap_default:
    external: true
  skybook_default:
    driver: bridge
