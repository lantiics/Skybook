services:
  skybook:
    image: skybook:latest
    restart: unless-stopped
    networks:
      - cap_default
      - skybook_default
    ports:
      - 3000:3000
    volumes:
      - ./.env:/app/.env
      - ./config.toml:/app/config.toml
  postgres:
    image: postgres
    restart: unless-stopped
    env_file: ./.env.postgres 
    networks:
      - skybook_default
    environment:
      POSTGRES_DB: skybook
    ports:
      - 5432:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql
      - ./schema:/docker-entrypoint-initdb.d/

configs:
  skybook_config:
    file: ./config.toml

networks:
  cap_default:
    external: true
  skybook_default:
    driver: bridge
